{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IQS Live Overlay</title>

  <!-- Optional: your site font if you have one; otherwise system UI -->
  <style>
    :root{
      --bg: rgba(10, 15, 26, 0.55);
      --panel: rgba(15, 23, 42, 1);
      --panel2: rgba(2, 6, 23, 1);
      --text: rgba(226, 232, 240, 0.95);
      --muted: rgba(148, 163, 184, 0.9);
      --line: rgba(148, 163, 184, 0.20);
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
      --radius: 16px;
    }

    /* OBS-friendly: transparent page */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color: var(--text);
    }

    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none; /* don’t steal mouse in OBS */
    }

    /* Top-left “info bar” */
    .hud {
      position: absolute;
      left: 24px;
      top: 24px;
      width: min(720px, calc(100% - 48px));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: 16px 18px;
    }

    .hud-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(2, 6, 23, 0.6);
      border: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(148, 163, 184, 0.9);
      box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.15);
    }
    .status-live .dot {
      background: rgba(34, 197, 94, 0.95);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
    }
    .status-stale .dot {
      background: rgba(245, 158, 11, 0.95);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18);
    }

    .meta {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr 1fr;
      gap: 10px 14px;
      font-size: 14px;
    }

    .kv {
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      min-width: 0;
    }

    .k {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.3px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .v {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Bottom “chart card” */
    .chart-card {
      position: absolute;
      left: 24px;
      bottom: 24px;
      width: min(920px, calc(100% - 48px));
      height: 260px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: 12px 14px 10px;
    }

    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .chart-title {
      font-size: 13px;
      font-weight: 700;
      color: rgba(226, 232, 240, 0.92);
    }

    .small {
      font-size: 12px;
      color: var(--muted);
    }

    #liveChart {
      width: 100%;
      height: calc(100% - 28px);
    }

    /* Hide overlay entirely if you ever want to toggle with a class */
    .hidden { display: none; }

    /* ── Overlay card (form response pop-up) ────────────────────── */
    .oc-wrap {
      position: absolute;
      right: 24px;
      bottom: 24px;
      width: min(460px, calc(100% - 48px));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      overflow: hidden;
      /* GSAP controls visibility; start invisible */
      opacity: 0;
      visibility: hidden;
    }

    .oc-body {
      padding: 18px 20px 14px;
    }

    .oc-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .oc-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: rgba(96,165,250,.9);
      background: rgba(96,165,250,.1);
      border: 1px solid rgba(96,165,250,.2);
      border-radius: 999px;
      padding: 3px 9px;
    }

    .oc-team {
      font-size: 12px;
      color: rgba(148,163,184,.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .oc-question {
      font-size: 13px;
      color: rgba(148,163,184,.85);
      margin: 0 0 7px;
      line-height: 1.45;
    }

    .oc-answer {
      font-size: 20px;
      font-weight: 700;
      color: rgba(226,232,240,.97);
      line-height: 1.35;
      margin: 0;
    }

    /* Progress bar at bottom */
    .oc-progress {
      height: 3px;
      background: rgba(148,163,184,.15);
    }

    .oc-progress-fill {
      height: 100%;
      background: rgba(96,165,250,.7);
      transform-origin: left center;
    }

    /* ── Profile card ───────────────────────────────────────────── */
    .oc-profile-inner {
      display: flex;
      gap: 16px;
      padding: 18px 20px 14px;
    }

    .oc-profile-photo {
      width: 110px;
      height: 110px;
      flex-shrink: 0;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--line);
      background: rgba(148,163,184,.08);
    }

    .oc-profile-photo-placeholder {
      width: 110px;
      height: 110px;
      flex-shrink: 0;
      border-radius: 12px;
      border: 1px dashed var(--line);
      background: rgba(148,163,184,.05);
    }

    .oc-profile-text { flex: 1; min-width: 0; }

    .oc-profile-name {
      font-size: 20px;
      font-weight: 800;
      color: rgba(226,232,240,.97);
      margin-bottom: 5px;
      line-height: 1.2;
    }

    .oc-profile-bio {
      font-size: 13px;
      color: rgba(148,163,184,.9);
      line-height: 1.45;
      margin-bottom: 8px;
    }

    .oc-profile-stats { display: flex; flex-direction: column; gap: 4px; }

    .oc-profile-stat {
      font-size: 13px;
      color: rgba(226,232,240,.8);
    }

    /* ── Image card ─────────────────────────────────────────────── */
    .oc-image-photo {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      display: block;
      border-radius: var(--radius) var(--radius) 0 0;
    }

    .oc-image-caption {
      padding: 12px 16px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .oc-image-caption-text {
      font-size: 14px;
      font-weight: 600;
      color: rgba(226,232,240,.92);
    }
  </style>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- GSAP for animations -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>

  <script>window.IQS = { apiUrl: "{{ api_url }}" };</script>
  <script defer src="{% static 'live/js/live_overlay.js' %}"></script>
</head>

<body>
  <div class="overlay">
    <div class="hud">
      <div class="hud-row">
        <div class="title">Live Pull</div>
        <div class="status-pill" id="statusPill">
          <span class="dot"></span>
          <span id="statusText">Connecting…</span>
        </div>
      </div>

      <div class="meta">
        <div class="kv">
          <div class="k">Team</div>
          <div class="v"><span data-field="team_name">TEAM</span> <span data-field="team_number">#</span></div>
        </div>

        <div class="kv">
          <div class="k">Distance</div>
          <div class="v"><span data-field="distance">0.0</span> ft</div>
        </div>

        <div class="kv">
          <div class="k">Hook</div>
          <div class="v"><span data-field="hook_name">HOOK</span></div>
        </div>

        <div class="kv">
          <div class="k">Speed</div>
          <div class="v"><span data-field="speed">0.0</span> ft/s</div>
        </div>

        <div class="kv">
          <div class="k">Force</div>
          <div class="v"><span data-field="force">0</span> lbf</div>
        </div>

        <div class="kv">
          <div class="k">Pull</div>
          <div class="v"><span data-field="pull_id">—</span></div>
        </div>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-header">
        <div class="chart-title">Speed & Force vs Distance</div>
        <div class="small">Auto-updating</div>
      </div>
      <canvas id="liveChart"></canvas>
    </div>

    <!-- Stat card (single Q&A) -->
    <div class="oc-wrap" id="ocStatCard">
      <div class="oc-body">
        <div class="oc-meta">
          <span class="oc-badge" id="ocBadge">Form Response</span>
          <span class="oc-team" id="ocTeam"></span>
        </div>
        <p class="oc-question" id="ocQuestion"></p>
        <p class="oc-answer" id="ocAnswer"></p>
      </div>
      <div class="oc-progress"><div class="oc-progress-fill" id="ocProgress"></div></div>
    </div>

    <!-- Profile card (photo + name + bio + stats) -->
    <div class="oc-wrap" id="ocProfileCard">
      <div class="oc-profile-inner">
        <img class="oc-profile-photo" id="ocProfilePhoto" src="" alt="" style="display:none">
        <div class="oc-profile-photo-placeholder" id="ocProfilePhotoPlaceholder"></div>
        <div class="oc-profile-text">
          <div class="oc-meta" style="margin-bottom:8px">
            <span class="oc-badge" id="ocProfileBadge">Profile</span>
            <span class="oc-team" id="ocProfileTeam"></span>
          </div>
          <div class="oc-profile-name" id="ocProfileName"></div>
          <div class="oc-profile-bio" id="ocProfileBio"></div>
          <div class="oc-profile-stats" id="ocProfileStats"></div>
        </div>
      </div>
      <div class="oc-progress"><div class="oc-progress-fill" id="ocProfileProgress"></div></div>
    </div>

    <!-- Image card (full-width image + caption) -->
    <div class="oc-wrap" id="ocImageCard">
      <img class="oc-image-photo" id="ocImagePhoto" src="" alt="">
      <div class="oc-image-caption">
        <span class="oc-badge" id="ocImageBadge">Photo</span>
        <span class="oc-image-caption-text" id="ocImageCaption"></span>
      </div>
      <div class="oc-progress"><div class="oc-progress-fill" id="ocImageProgress"></div></div>
    </div>
  </div>
</body>
</html>
